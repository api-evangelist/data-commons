aid: data-commons
name: Data Commons
description: >-
  Data Commons is an open knowledge graph initiative led by Google that aggregates and harmonizes the world's public
  data into a single graph, making global statistical data simple to explore, query, and integrate through REST, Python,
  BigQuery, web component, and MCP interfaces.
